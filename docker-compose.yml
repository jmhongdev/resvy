services:
  postgres:
    image: postgres:16
    container_name: resvy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resvy
      POSTGRES_USER: resvy_user
      POSTGRES_PASSWORD: resvy_pass
    ports:
      - "5432:5432"
    volumes:
      - resvy_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  resvy_pgdata: